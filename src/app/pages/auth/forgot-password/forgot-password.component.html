<div class="auth-page fade-in">
  <div class="auth-card card">

    <a routerLink="/" class="auth-logo">
      <div class="auth-logo__icon">S</div>
      <span>Souk<em>Mar</em></span>
    </a>

    <h1 class="auth-title">{{ 'auth.forgot_title' | T }}</h1>
    <p class="auth-sub">{{ 'auth.forgot_sub' | T }}</p>

    @if (sent) {
      <div class="auth-success">✅ {{ 'auth.forgot_sent' | T:{email: email} }}</div>
      <a routerLink="/auth/login" class="btn-primary auth-submit" style="display:flex;justify-content:center;text-decoration:none">
        {{ 'auth.back_to_login' | T }}
      </a>
    } @else {
      @if (error) {
        <div class="auth-error">{{ error }}</div>
      }

      <form (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <label>{{ 'auth.email' | T }}</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" [(ngModel)]="email" name="email" placeholder="votre&#64;email.com" required style="padding-left:2.6rem" />
          </div>
        </div>

        <button type="submit" class="btn-primary auth-submit" [disabled]="loading">
          @if (loading) { <span class="spinner"></span> }
          {{ 'auth.forgot_btn' | T }}
        </button>
      </form>

      <p class="auth-switch">
        <a routerLink="/auth/login">{{ 'auth.back_to_login' | T }}</a>
      </p>
    }
  </div>
</div>
