<div class="legal-page container fade-in">
  @if (!isInfoPage) {
    <a routerLink="/mentions-legales" class="legal-page__back">← {{ 'parametres.legal' | T }}</a>
  }
  <h1 class="legal-page__title">{{ titleKey | T }}</h1>
  @if (!isInfoPage) {
    <p class="legal-page__updated">{{ 'legal.last_updated' | T }}</p>
  }

  @for (n of sections; track n) {
    <section class="legal-page__section">
      <h2>{{ (namespace + '.s' + n + '_title') | T }}</h2>
      <p>{{ (namespace + '.s' + n + '_body') | T }}</p>
    </section>
  }
</div>
