<button
  type="button"
  class="block-btn__toggle"
  [class.block-btn--compact]="compact"
  [class.block-btn--active]="blocked"
  [disabled]="submitting()"
  (click)="toggle()"
>
  <app-icon [name]="blocked ? 'unlock' : 'block'" [size]="14" />
  {{ (blocked ? 'block.unblock' : 'block.block') | T }}
</button>
