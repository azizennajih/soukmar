<div class="city-select">
  <div class="city-select__field" #fieldWrap [class.city-select__field--open]="open()">
    <svg class="city-select__icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <input
      type="text"
      [value]="displayValue"
      [placeholder]="placeholder"
      (focus)="onFocus()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
      autocomplete="off"
    />
    @if (value) {
      <button type="button" class="city-select__clear" (click)="clear($event)" aria-label="Effacer">✕</button>
    }
    @if (showGps) {
      <button
        type="button"
        class="city-select__gps"
        [class.city-select__gps--loading]="gpsLoading()"
        (click)="useGps($event)"
        [attr.aria-label]="'annonces.use_gps' | T"
        [title]="'annonces.use_gps' | T"
      >
        @if (gpsLoading()) {
          <span class="city-select__spinner"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        }
      </button>
    }
  </div>

  @if (gpsError()) {
    <div class="city-select__gps-error">{{ 'annonces.gps_error' | T }}</div>
  }

  @if (open()) {
    <div class="city-select__panel" [style.top]="panelStyle().top" [style.left]="panelStyle().left" [style.width]="panelStyle().width">
      @if (filtered().length) {
        @for (city of filtered(); track city; let i = $index) {
          <button
            type="button"
            class="city-select__option"
            [class.city-select__option--active]="i === activeIndex()"
            [class.city-select__option--selected]="city === value"
            (mousedown)="$event.preventDefault(); select(city)"
          >{{ city }}</button>
        }
      } @else {
        <div class="city-select__empty">{{ 'common.no_results' | T }}</div>
      }
    </div>
  }
</div>
