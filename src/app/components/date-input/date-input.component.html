<div class="date-input">
  <div class="date-input__field" #fieldWrap [class.date-input__field--open]="open()">
    @for (part of format.order; track part; let i = $index) {
      @if (i > 0) { <span class="date-input__sep">{{ format.separator }}</span> }
      <input type="text" inputmode="numeric" class="date-input__seg" [class.date-input__seg--md]="part !== 'year'" [class.date-input__seg--yr]="part === 'year'"
             [placeholder]="placeholders[part]" [ngModel]="valueOf(part)" (ngModelChange)="onFieldInput(part, $event)" />
    }

    <button type="button" class="date-input__cal-btn" (click)="toggle()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </button>
  </div>

  @if (open()) {
    <div class="date-input__panel" [style.top]="panelStyle().top" [style.left]="panelStyle().left" [style.width]="panelStyle().width">
      <div class="date-input__header">
        <button type="button" (click)="prevMonth()">‹</button>
        <span>{{ monthYearLabel }}</span>
        <button type="button" (click)="nextMonth()">›</button>
      </div>
      <div class="date-input__weekdays">
        @for (w of weekdayNames; track w) { <span>{{ w }}</span> }
      </div>
      <div class="date-input__grid">
        @for (cell of calendarDays; track cell.year + '-' + cell.month + '-' + cell.date) {
          <button
            type="button"
            class="date-input__day"
            [class.date-input__day--other]="cell.otherMonth"
            [class.date-input__day--today]="cell.isToday"
            [class.date-input__day--selected]="cell.isSelected"
            (click)="pick(cell)"
          >{{ cell.date }}</button>
        }
      </div>
    </div>
  }
</div>
