@if (show) {
  <div class="search-suggestions" [style.top]="panelStyle().top" [style.left]="panelStyle().left" [style.width]="panelStyle().width">
    @for (item of items; track $index; let i = $index) {
      <button
        type="button"
        class="search-suggestions__item"
        [class.search-suggestions__item--active]="i === activeIndex()"
        (mousedown)="$event.preventDefault()"
        (click)="select(item.q, item.category)"
      >
        <svg class="search-suggestions__icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span><strong>{{ item.q }}</strong> {{ item.suffix }}</span>
      </button>
    }
  </div>
}
