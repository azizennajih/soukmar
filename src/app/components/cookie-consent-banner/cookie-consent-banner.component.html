@if (cookieConsent.consent() === null) {
  <div class="cookie-banner">
    <div class="cookie-banner__inner container">
      <p class="cookie-banner__text">
        {{ 'cookie_consent.message' | T }}
        <a routerLink="/politique-confidentialite">{{ 'cookie_consent.learn_more' | T }}</a>
      </p>
      <div class="cookie-banner__actions">
        <button type="button" class="btn-primary" (click)="choose('essential')">{{ 'cookie_consent.decline' | T }}</button>
        <button type="button" class="btn-primary" (click)="choose('all')">{{ 'cookie_consent.accept' | T }}</button>
      </div>
    </div>
  </div>
}
