<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SouqMar24 Branding-Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>body{font:14px system-ui;padding:1rem}li{margin:.2rem 0}</style>
</head>
<body>
<h1>SouqMar24 Branding</h1>
<ul id="log"></ul>
<script>
const C = { primary: '#D93D4A', primaryLight: '#FEF1F2', gold: '#C9941A', goldLight: '#FEF6E4', secondary: '#1E3A5F', text: '#111827', bg: '#F8F7F5', white: '#FFFFFF' };
// S aus public/favicon.svg (viewBox 64)
const S_PATH = new Path2D('M43 21.5C41.5 15.5 22 14.5 22 25.5c0 10.5 21 5.5 21 15.5 0 11-19.5 10-22 3');
const HEAD = '"Plus Jakarta Sans", sans-serif';

function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

/** Roter Kachel-S an Position, Kantenlaenge size. radius 14/64 wie im Favicon. */
function tile(ctx, x, y, size, { bg = C.primary, fg = C.white, round = true } = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (bg) { ctx.fillStyle = bg; rr(ctx, 0, 0, size, size, round ? size * 14 / 64 : 0); ctx.fill(); }
  ctx.scale(size / 64, size / 64);
  ctx.strokeStyle = fg; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke(S_PATH);
  ctx.restore();
}
/** S ohne Kachel, um scale vergroessert und zentriert (fuer Profilbild mit Vollflaeche). */
function bigS(ctx, cx, cy, size, fg) {
  // Der S-Pfad liegt in den 64er Koordinaten ca. 17..47 x 12..48 (Mitte ~ 32/30)
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(size / 64, size / 64);
  ctx.strokeStyle = fg; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke(S_PATH);
  ctx.restore();
}
/** Wortmarke: Kachel + "SouqMar" + "24". Gibt Breite zurueck; origin links, vertikal mittig bei cy. */
function wordmark(ctx, x, cy, fontSize, { text = C.text, accent = C.primary, tileBg = C.primary, tileFg = C.white, measureOnly = false } = {}) {
  const t = fontSize * 1.35, gap = fontSize * 0.42;
  ctx.font = `800 ${fontSize}px ${HEAD}`;
  const w1 = ctx.measureText('SouqMar').width, w2 = ctx.measureText('24').width;
  const total = t + gap + w1 + w2;
  if (!measureOnly) {
    tile(ctx, x, cy - t / 2, t, { bg: tileBg, fg: tileFg });
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    const base = cy + fontSize * 0.36;
    ctx.fillStyle = text; ctx.fillText('SouqMar', x + t + gap, base);
    ctx.fillStyle = accent; ctx.fillText('24', x + t + gap + w1, base);
  }
  return total;
}
function centeredWordmark(ctx, cx, cy, fontSize, opts) {
  const w = wordmark(ctx, 0, cy, fontSize, { ...opts, measureOnly: true });
  wordmark(ctx, cx - w / 2, cy, fontSize, opts);
}
function domain(ctx, cx, y, size, color) {
  ctx.font = `500 ${size}px Inter, sans-serif`; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('souqmar24.com', cx, y);
}
function dots(ctx, w, h, color, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(w * 0.06, h * 0.08, Math.min(w, h) * 0.34, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.96, h * 0.95, Math.min(w, h) * 0.42, 0, 7); ctx.fill();
  ctx.restore();
}

const ASSETS = [
  // Logo-Dateien (mit transparentem Hintergrund, falls nicht anders vermerkt)
  { name: 'logo/logo-icon-1024', w: 1024, h: 1024, draw: (c) => tile(c, 0, 0, 1024) },
  { name: 'logo/logo-icon-512', w: 512, h: 512, draw: (c) => tile(c, 0, 0, 512) },
  { name: 'logo/logo-horizontal-transparent', w: 1800, h: 480, draw: (c) => centeredWordmark(c, 900, 240, 190) },
  { name: 'logo/logo-horizontal-white-bg', w: 1800, h: 480, draw: (c) => { c.fillStyle = C.white; c.fillRect(0, 0, 1800, 480); centeredWordmark(c, 900, 240, 190); } },
  { name: 'logo/logo-horizontal-fuer-dunklen-hintergrund', w: 1800, h: 480, draw: (c) => { c.fillStyle = C.secondary; c.fillRect(0, 0, 1800, 480); centeredWordmark(c, 900, 240, 190, { text: C.white }); } },
  { name: 'logo/logo-header-600x160', w: 600, h: 160, draw: (c) => centeredWordmark(c, 300, 80, 64) },
  // Profilbilder: Vollflaeche, die Plattformen schneiden einen Kreis aus -> S klein genug in der Mitte
  { name: 'profilbild/profilbild-facebook-instagram-tiktok-1080', w: 1080, h: 1080, draw: (c) => { c.fillStyle = C.primary; c.fillRect(0, 0, 1080, 1080); bigS(c, 540, 540, 640, C.white); } },
  { name: 'profilbild/profilbild-rund-vorschau-720', w: 720, h: 720, draw: (c) => { c.fillStyle = C.primary; c.beginPath(); c.arc(360, 360, 360, 0, 7); c.fill(); bigS(c, 360, 360, 430, C.white); } },
  // Facebook
  { name: 'facebook/facebook-titelbild-1640x624', w: 1640, h: 624, draw: (c) => {
      const g = c.createLinearGradient(0, 0, 1640, 624); g.addColorStop(0, C.white); g.addColorStop(1, C.primaryLight);
      c.fillStyle = g; c.fillRect(0, 0, 1640, 624); dots(c, 1640, 624, C.primary, 0.07);
      centeredWordmark(c, 820, 290, 130); domain(c, 820, 430, 40, C.secondary); } },
  { name: 'facebook/facebook-link-vorschau-1200x630', w: 1200, h: 630, draw: (c) => {
      c.fillStyle = C.primary; c.fillRect(0, 0, 1200, 630); dots(c, 1200, 630, C.white, 0.08);
      centeredWordmark(c, 600, 290, 108, { text: C.white, accent: C.goldLight, tileBg: C.white, tileFg: C.primary });
      domain(c, 600, 420, 36, C.white); } },
  // Instagram / Facebook Beitrag, Story
  { name: 'instagram/beitrag-quadrat-1080x1080', w: 1080, h: 1080, draw: (c) => {
      c.fillStyle = C.primary; c.fillRect(0, 0, 1080, 1080); dots(c, 1080, 1080, C.white, 0.08);
      tile(c, 390, 270, 300, { bg: C.white, fg: C.primary });
      centeredWordmark(c, 540, 680, 92, { text: C.white, accent: C.goldLight, tileBg: 'transparent', tileFg: 'transparent' });
      domain(c, 540, 790, 38, C.white); } },
  { name: 'instagram/story-1080x1920', w: 1080, h: 1920, draw: (c) => {
      c.fillStyle = C.primary; c.fillRect(0, 0, 1080, 1920); dots(c, 1080, 1920, C.white, 0.08);
      tile(c, 340, 640, 400, { bg: C.white, fg: C.primary });
      centeredWordmark(c, 540, 1130, 108, { text: C.white, accent: C.goldLight, tileBg: 'transparent', tileFg: 'transparent' });
      domain(c, 540, 1260, 44, C.white); } },
  // TikTok: Videocover 9:16 (heller Hintergrund, Wortmarke)
  { name: 'tiktok/tiktok-videocover-1080x1920', w: 1080, h: 1920, draw: (c) => {
      const g = c.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, C.white); g.addColorStop(1, C.primaryLight);
      c.fillStyle = g; c.fillRect(0, 0, 1080, 1920);
      tile(c, 340, 640, 400, {});
      centeredWordmark(c, 540, 1130, 108, { tileBg: 'transparent', tileFg: 'transparent' });
      domain(c, 540, 1260, 44, C.secondary); } },
];
// Startbild der Apps (Android + iOS): weisse Wortmarke auf dem Marken-Rot, das Rot setzen die Apps selbst als Hintergrund.
// fitWordmark: Wortmarke so skalieren, dass sie targetW breit ist; Kachel weiss mit rotem S, "24" in goldLight wie in den Social-Bildern.
const SPLASH = { text: C.white, accent: C.goldLight, tileBg: C.white, tileFg: C.primary };
function fitWordmark(ctx, cx, cy, targetW) {
  const probe = wordmark(ctx, 0, 0, 100, { ...SPLASH, measureOnly: true });
  const fs = 100 * targetW / probe;
  centeredWordmark(ctx, cx, cy, fs, SPLASH);
  return fs;
}
// Enges Bild fuer Android (3x-Datei) und iOS (1x/2x/3x): 240 pt breit.
const splashIos = (scale) => {
  const w = 240 * scale, h = Math.ceil(240 * scale * 0.5);
  return { name: 'splash/splash-ios-' + scale + 'x', w, h, draw: (c) => fitWordmark(c, w / 2, h / 2, w - 4) };
};
ASSETS.push(
  // Android und iOS nutzen dasselbe enge Bild (Android: 224 dp breit im Compose-Startbild, iOS: 240 pt im Launch-Screen)
  splashIos(1), splashIos(2), splashIos(3),
);
// App-Symbol (iOS AppIcon 1024): Vollflaeche Marken-Rot, weisses S, keine Rundung und keine Transparenz (iOS rundet selbst).
// Der S-Pfad liegt in den 64er Koordinaten mit Mitte bei ca. (32, 30.5): um 1.5 Einheiten nach unten gerueckt, damit er optisch mittig sitzt.
ASSETS.push({ name: 'appicon/appicon-ios-1024', w: 1024, h: 1024, draw: (c) => { c.fillStyle = C.primary; c.fillRect(0, 0, 1024, 1024); bigS(c, 512, 512 + 1.5 * 1100 / 64, 1100, C.white); } });
// Wortmarke ohne Kachel (tileBg transparent): Kachelbreite bleibt als Luft -> fuer die Beitraege die Kachel oben, Text unten: Luft links abziehen
// (wird in wordmark() ueber tileBg 'transparent' nicht entfernt, daher Textblock separat zentrieren)
const _wm = wordmark;
wordmark = function (ctx, x, cy, fs, o = {}) {
  if (o.tileBg === 'transparent') {
    ctx.font = `800 ${fs}px ${HEAD}`;
    const w1 = ctx.measureText('SouqMar').width, w2 = ctx.measureText('24').width;
    if (!o.measureOnly) {
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; const base = cy + fs * 0.36;
      ctx.fillStyle = o.text || C.text; ctx.fillText('SouqMar', x, base);
      ctx.fillStyle = o.accent || C.primary; ctx.fillText('24', x + w1, base);
    }
    return w1 + w2;
  }
  return _wm(ctx, x, cy, fs, o);
};

// ---- Werbe-/Affiliate-Banner (Admin-Tab "Banner"): 160x600 (links/rechts) und 1200x250 (zwischen den Anzeigen), je mit
// doppelter Aufloesung gezeichnet. Bewusst ohne Partner-Logos (Nutzungsbedingungen der Programme pruefen); das Wort
// "Werbung" setzt die Website selbst darueber.
const BANNER_SPECS = [
  { key: 'expedia-hotels-de', title: 'Hotels in Marokko', sub: 'Jetzt vergleichen und buchen', cta: 'Hotels ansehen', bg: [C.secondary, '#2B4F7E'], fg: C.white, accent: C.goldLight, ctaBg: C.white, ctaFg: C.secondary },
  { key: 'expedia-hotels-fr', title: 'Hôtels au Maroc', sub: 'Comparez et réservez', cta: 'Voir les hôtels', bg: [C.secondary, '#2B4F7E'], fg: C.white, accent: C.goldLight, ctaBg: C.white, ctaFg: C.secondary },
  { key: 'check24-reisen-de', title: 'Mietwagen & Pauschalreisen', sub: 'Preise vergleichen', cta: 'Angebote ansehen', bg: [C.goldLight, '#FBE9C4'], fg: C.text, accent: C.primary, ctaBg: C.primary, ctaFg: C.white },
  { key: 'check24-kfz-de', title: 'Kfz-Versicherung', sub: 'Tarife jetzt vergleichen', cta: 'Jetzt vergleichen', bg: ['#111827', '#1F2937'], fg: C.white, accent: C.goldLight, ctaBg: C.goldLight, ctaFg: C.text },
  { key: 'trip-reisen-de', title: 'Flüge & Hotels weltweit', sub: 'Bei Trip.com vergleichen', cta: 'Zum Angebot', bg: [C.primary, '#B9303C'], fg: C.white, accent: C.goldLight, ctaBg: C.white, ctaFg: C.primary },
  { key: 'trip-reisen-fr', title: 'Vols & hôtels', sub: 'Comparez sur Trip.com', cta: 'Voir l’offre', bg: [C.primary, '#B9303C'], fg: C.white, accent: C.goldLight, ctaBg: C.white, ctaFg: C.primary },
];

/** Zeilenumbruch; verkleinert die Schrift, bis das laengste Wort in maxW passt. Gibt { lines, size } zurueck. */
function fitText(ctx, text, maxW, size, weight, family) {
  for (let s = size; s >= 8; s -= 1) {
    ctx.font = `${weight} ${s}px ${family}`;
    const words = text.split(' ');
    if (words.some((w) => ctx.measureText(w).width > maxW)) continue;
    const lines = []; let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    lines.push(line);
    return { lines, size: s };
  }
  return { lines: [text], size: 8 };
}
/** Sonne und zwei Duenen als schlichtes Marokko-Motiv, unten in der Box (x, y, w, h). */
function scenery(ctx, x, y, w, h, color, sun) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y - 200, w, h + 200); ctx.clip();
  ctx.globalAlpha = 0.22; ctx.fillStyle = color;
  const s0 = sun || { cx: x + w * 0.7, cy: y + h * 0.38, r: Math.min(w, h) * 0.26 };
  ctx.beginPath(); ctx.arc(s0.cx, s0.cy, s0.r, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.3;
  ctx.beginPath(); ctx.moveTo(x, y + h * 0.78);
  ctx.bezierCurveTo(x + w * 0.3, y + h * 0.5, x + w * 0.6, y + h * 0.95, x + w, y + h * 0.65); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.fill();
  ctx.globalAlpha = 0.2;
  ctx.beginPath(); ctx.moveTo(x, y + h * 0.9);
  ctx.bezierCurveTo(x + w * 0.4, y + h * 0.7, x + w * 0.7, y + h * 1.05, x + w, y + h * 0.85); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.fill();
  ctx.restore();
}
function button(ctx, x, y, w, h, label, spec, size) {
  ctx.fillStyle = spec.ctaBg; rr(ctx, x, y, w, h, h / 2); ctx.fill();
  ctx.font = `800 ${size}px ${HEAD}`; ctx.fillStyle = spec.ctaFg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
}
function drawBanner(ctx, spec, kind) {
  const [w, h] = kind === 'side' ? [160, 600] : [1200, 250];
  ctx.save(); ctx.scale(2, 2);
  const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, spec.bg[0]); g.addColorStop(1, spec.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.textBaseline = 'alphabetic';
  const sc = spec.fg === C.text ? spec.accent : spec.fg;
  if (kind === 'side') {
    scenery(ctx, 0, 380, w, 220, sc);
    const pad = 14, maxW = w - pad * 2;
    const t = fitText(ctx, spec.title, maxW, 30, 800, HEAD);
    ctx.font = `800 ${t.size}px ${HEAD}`; ctx.fillStyle = spec.fg; ctx.textAlign = 'left';
    let y = 110; for (const l of t.lines) { ctx.fillText(l, pad, y); y += t.size * 1.2; }
    const s = fitText(ctx, spec.sub, maxW, 15, 500, 'Inter, sans-serif');
    ctx.font = `500 ${s.size}px Inter, sans-serif`; ctx.fillStyle = spec.accent; y += 6;
    for (const l of s.lines) { ctx.fillText(l, pad, y); y += s.size * 1.35; }
    let bsSize = 15; for (; bsSize > 8; bsSize--) { ctx.font = `800 ${bsSize}px ${HEAD}`; if (ctx.measureText(spec.cta).width <= maxW - 28) break; }
    const bs = { size: bsSize };
    button(ctx, pad, y + 22, maxW, 44, spec.cta, spec, bs.size);
  } else {
    scenery(ctx, 0, 176, 1200, 74, sc, { cx: 770, cy: 120, r: 34 });
    const pad = 56, maxW = 640;
    const t = fitText(ctx, spec.title, maxW, 56, 800, HEAD);
    ctx.font = `800 ${t.size}px ${HEAD}`; ctx.fillStyle = spec.fg; ctx.textAlign = 'left';
    const lineH = t.size * 1.15, total = t.lines.length * lineH + 8 + 26;
    let y = (h - 12 - total) / 2 + t.size * 0.85;
    for (const l of t.lines) { ctx.fillText(l, pad, y); y += lineH; }
    ctx.font = `500 26px Inter, sans-serif`; ctx.fillStyle = spec.accent; ctx.fillText(spec.sub, pad, y - lineH + 38);
    button(ctx, w - pad - 300, (h - 76) / 2, 300, 76, spec.cta, spec, 28);
  }
  ctx.restore();
}
for (const spec of BANNER_SPECS) {
  ASSETS.push({ name: `werbung/${spec.key}-160x600`, w: 320, h: 1200, draw: (c) => drawBanner(c, spec, 'side') });
  ASSETS.push({ name: `werbung/${spec.key}-1200x250`, w: 2400, h: 500, draw: (c) => drawBanner(c, spec, 'inline') });
}

(async () => {
  await Promise.all([document.fonts.load('800 100px "Plus Jakarta Sans"'), document.fonts.load('500 40px Inter')]);
  const log = document.getElementById('log');
  const only = new URLSearchParams(location.search).get('only'); // z. B. ?only=splash erzeugt nur diese Dateien
  for (const a of ASSETS.filter((x) => !only || x.name.startsWith(only))) {
    const cv = document.createElement('canvas'); cv.width = a.w; cv.height = a.h;
    const ctx = cv.getContext('2d'); a.draw(ctx);
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    const res = await fetch('/save?name=' + encodeURIComponent(a.name), { method: 'POST', body: blob });
    const li = document.createElement('li'); li.textContent = `${res.ok ? 'OK' : 'FEHLER'} ${a.name}.png ${a.w}x${a.h}`; log.appendChild(li);
  }
  document.title = 'FERTIG';
})();
</script>
</body>
</html>
